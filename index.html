<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zeed Price Split</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --ink:#1E1E1E; --green:#06C18B; --deep:#028960; --mint:#E6F8F1;
    --cream:#F9F8F1; --paper:#FFFFFF; --mist:#E6E6E1; --muted:#66665E;
    --line:rgba(30,30,30,.12); --stage:#131513;
    --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --body:"Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    --spring:cubic-bezier(.3,1.12,.5,1);
    --out:cubic-bezier(.2,.9,.25,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--green);outline-offset:3px}
  .riyal{display:inline-block;width:.72em;height:.72em;flex:none}

  /* merchant stage */
  .stage{min-height:100%;display:grid;place-items:center;padding-block:24px;padding-inline:16px}
  .page-wrap{width:min(100%,1440px);position:relative;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);transition:filter .5s var(--out),transform .6s var(--out)}
  .page-layer{position:absolute;left:0;top:0;width:1903px;height:910px;transform-origin:0 0;transform:scale(var(--s,.5))}
  .page-layer>img{display:block;width:1903px;height:910px}
  body.sheet-open .page-wrap{filter:blur(6px) saturate(.7) brightness(.55);transform:scale(.985)}
  .mini-pdp{display:none}

  /* widget */
  .zw{position:absolute;left:1242px;top:685px;width:403px;height:121px;display:grid;grid-template-columns:118px 1fr;align-items:center;gap:14px;
      padding:14px 16px 14px 18px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;
      box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 26px -14px rgba(2,137,96,.45);transition:transform .25s var(--spring),box-shadow .25s}
  .zw:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 16px 32px -14px rgba(2,137,96,.55)}
  .zw-logo{display:flex;align-items:center;gap:4px}
  .zw-logo .word{width:76px;height:auto}.zw-logo .paw{width:30px;height:auto;transition:transform .35s var(--spring)}
  .zw:hover .zw-logo .paw{transform:translateY(-5px) rotate(-8deg)}
  .zw-body{display:grid;gap:6px}
  .zw-amt{font-family:var(--display);font-weight:700;font-size:27px;line-height:1;display:flex;align-items:baseline;gap:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .zw-amt small{font-size:15px}
  .zw-amt em{font-style:normal;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-left:2px}
  .zw-dots{display:flex;gap:4px;width:100%}
  .zw-dots i{flex:1 1 0;min-width:0;max-width:16px;height:5px;border-radius:3px;background:#D8D8D0}
  .zw-dots i:first-child{background:var(--green)}
  .zw-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
  .zw-meta b{color:var(--ink);font-weight:600}
  .zw-cta{font-size:12.5px;font-weight:700;color:var(--deep);text-decoration:underline;text-underline-offset:3px}

  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(10,12,10,.35);opacity:0;pointer-events:none;transition:opacity .4s}
  body.sheet-open .scrim{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;top:50%;width:min(520px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;overflow-x:hidden;
         background:var(--cream);border-radius:28px;padding:24px 28px 26px;
         transform:translate(-50%,-44%) scale(.95);opacity:0;visibility:hidden;
         transition:transform .6s var(--spring),opacity .3s,visibility 0s .6s;box-shadow:0 40px 100px rgba(0,0,0,.45);scrollbar-width:none}
  .sheet::-webkit-scrollbar{display:none}
  body.sheet-open .sheet{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible;transition:transform .6s var(--spring),opacity .25s,visibility 0s}

  .sh-top{display:flex;justify-content:space-between;align-items:center}
  .logo{display:flex;align-items:center;gap:5px}
  .logo .word{width:88px;height:auto}.logo .paw{width:35px;height:auto}
  .close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);position:relative}
  .close:hover{background:var(--cream)}
  .close::before,.close::after{content:"";position:absolute;left:50%;top:50%;width:13px;height:2px;background:var(--ink);border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
  .close::after{transform:translate(-50%,-50%) rotate(-45deg)}

  .product{margin-top:18px;display:flex;align-items:center;gap:12px}
  .product img{width:44px;height:44px;border-radius:10px;object-fit:cover;object-position:50% 30%;border:1px solid var(--line);background:#eef0f3}
  .product .t{font-weight:600;font-size:14px}
  .product .s{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}

  .q{margin:22px 0 10px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.015em;text-wrap:balance}
  .q small{display:block;font-family:var(--body);font-weight:500;font-size:13.5px;letter-spacing:0;color:var(--muted);margin-top:3px}

  /* plan picker */
  .chips{position:relative;display:grid;grid-template-columns:repeat(5,1fr);padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:14px}
  .chips .ind{position:absolute;top:4px;bottom:4px;left:0;border-radius:10px;background:var(--ink);box-shadow:0 4px 12px -4px rgba(0,0,0,.4);transition:transform .45s var(--spring),width .45s var(--spring)}
  .chip{position:relative;z-index:1;height:54px;min-width:0;padding:0;border:0;border-radius:10px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:color .25s}
  .chip .n{font-weight:700;font-size:17px;line-height:1}
  .chip .u{font-size:11px;font-weight:500;color:var(--muted)}
  .chip[aria-checked="true"]{color:var(--cream)}
  .chip[aria-checked="true"] .u{color:#BDBDB4}
  .chip .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--deep);background:var(--mint);border:1px solid rgba(2,137,96,.25);border-radius:999px;padding:1px 6px;white-space:nowrap}

  /* plan summary */
  .plan{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;position:relative;overflow:hidden}
  .plan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .lbl{font-size:13px;font-weight:600;color:var(--muted)}
  .amount{font-family:var(--display);font-weight:700;font-size:48px;line-height:1;letter-spacing:-.03em;display:flex;align-items:flex-end;margin-top:6px;font-variant-numeric:tabular-nums}
  .amount .riyal{width:.5em;height:.5em;margin:0 .08em .3em 0;align-self:flex-end}
  .amount .dec{font-size:.5em;margin-bottom:.19em;letter-spacing:-.01em}
  .amount.hide{visibility:hidden}
  .amount .per{align-self:flex-end;font-family:var(--body);font-weight:600;font-size:16px;letter-spacing:0;color:var(--muted);line-height:1;margin:0 0 .42em 6px}
  .then{margin-top:8px;font-size:14.5px;line-height:1.45}
  .then b{font-weight:700}
  .then .riyal{width:.78em;height:.78em;margin:0 1px 0 2px;vertical-align:-.04em}

  .runner{width:70px;flex:none;margin-top:4px;margin-right:2px;transition:transform .5s var(--spring)}
  .runner .bob-wrap{transition:rotate .5s var(--spring);transform-origin:50% 100%}
  .runner .bob{position:relative;animation:bob var(--dur,.5s) ease-in-out infinite}
  .runner svg{display:block;width:100%;height:auto}
  .speed{position:absolute;left:-34px;top:16px;width:32px;height:30px;opacity:var(--speed,0);transition:opacity .4s}
  .speed i{position:absolute;right:0;height:2px;border-radius:2px;background:rgba(30,30,30,.3);animation:dash var(--dur,.5s) linear infinite}
  .speed i:nth-child(1){top:3px;width:22px}.speed i:nth-child(2){top:13px;width:30px;animation-delay:-.15s}.speed i:nth-child(3){top:23px;width:16px;animation-delay:-.3s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes dash{0%{transform:translateX(8px);opacity:0}30%{opacity:1}100%{transform:translateX(-18px);opacity:0}}
  @keyframes runin{from{transform:translateX(-380px)}to{transform:translateX(0)}}
  @keyframes hop{0%,100%{translate:0 0}40%{translate:0 -14px}}
  .runner.in{animation:runin .9s var(--out) both}
  .runner.hop .bob-wrap{animation:hop .45s var(--out)}
  .runner.exit{animation:exit .8s cubic-bezier(.5,0,.8,.3) forwards}
  @keyframes exit{to{transform:translateX(420px)}}

  .track{position:relative;height:50px;margin-top:16px;user-select:none;-webkit-user-select:none}
  .piece{position:absolute;top:0;height:50px;border:1px solid var(--line);border-radius:10px;background:var(--cream);
         display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);overflow:hidden;
         transition:left .6s var(--spring),width .6s var(--spring),opacity .3s,background-color .5s,color .5s,border-color .5s}
  .piece.today,.piece.hot{background:var(--green);border-color:var(--green);color:var(--ink)}
  .track.tight .piece{font-size:9px;letter-spacing:0}
  .track.notrans .piece{transition:none}
  @keyframes jolt{0%{transform:translateY(0)}40%{transform:translateY(-7px)}100%{transform:translateY(0)}}
  .piece.jolt{animation:jolt .55s var(--out) both;animation-delay:var(--delay)}
  .slab{position:absolute;inset:0;border-radius:10px;background:var(--green);display:flex;align-items:center;justify-content:center;gap:4px;
        font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;z-index:2;transition:opacity .15s}
  .slab .riyal{width:.62em;height:.62em}
  .slab.gone{opacity:0;pointer-events:none}
  .chk{position:absolute;inset:0;display:grid;place-items:center;background:var(--green);animation:pop .35s var(--spring) both}
  .chk::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--ink) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4.5 8.2l2.3 2.3 4.7-4.9' fill='none' stroke='%23F9F8F1' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/100% no-repeat}
  .track.tight .chk::after{width:16px;height:16px}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  .ends{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--muted)}
  .ends b{color:var(--ink);font-weight:600}

  .save{margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--mint);color:var(--deep);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .save .riyal{width:.8em;height:.8em}
  .save.off{background:var(--cream);color:var(--muted);font-weight:500}
  .save.pop{animation:pop .4s var(--spring)}

  .trust{margin-top:16px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:13px;color:var(--muted)}
  .trust span{display:inline-flex;align-items:center;gap:6px}
  .trust .tick{width:15px;height:15px;border-radius:50%;background:var(--green) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4.5 8.2l2.3 2.3 4.7-4.9' fill='none' stroke='%231E1E1E' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/100% no-repeat}
  .trust svg{width:15px;height:15px;color:var(--deep)}

  .cta{margin-top:16px;width:100%;height:56px;border-radius:999px;border:0;background:var(--ink);color:var(--cream);font-weight:700;font-size:16.5px;
       display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 12px 26px -12px rgba(30,30,30,.6);transition:transform .2s var(--spring),background-color .3s}
  .cta:hover{transform:translateY(-1px)}
  .cta:active{transform:translateY(1px)}
  .cta .riyal{width:.75em;height:.75em;color:var(--green)}
  .cta b{color:var(--green)}
  .cta.done{background:var(--green);color:var(--ink);box-shadow:0 12px 26px -14px rgba(2,137,96,.9)}
  .cta.done b{color:var(--ink)}

  .flyer{position:fixed;z-index:50;margin:0;pointer-events:none;transform-origin:0 0}
  .replay{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--cream);font-weight:700;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.35)}

  @media (max-width:760px){
    .stage{place-items:start center;padding-block:20px 80px}
    .page-wrap{height:auto!important;background:var(--paper);box-shadow:none;border-radius:16px;padding:16px}
    .page-layer{position:static;width:auto;height:auto;transform:none}
    .page-layer>img{display:none}
    .mini-pdp{display:grid;gap:10px;margin-bottom:16px}
    .mini-pdp img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#eef0f3}
    .mini-pdp .t{font-size:18px;font-weight:600}
    .mini-pdp .p{font-size:22px;color:#1d4a8f;font-weight:600;display:flex;align-items:center;gap:4px}
    .zw{position:relative;left:auto;top:auto;width:100%;height:auto;grid-template-columns:92px 1fr;gap:10px;padding:14px}
    .zw-logo .word{width:58px}.zw-logo .paw{width:24px}
    .zw-amt{font-size:23px}
    .sheet{top:auto;bottom:0;left:0;width:100%;max-height:94%;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%)}
    body.sheet-open .sheet{transform:translateY(0)}
    body.sheet-open .replay{display:none}
    .q{font-size:20px}
    .chip .u{font-size:10px}
    .amount{font-size:42px}
    .runner{width:60px}
    .plan{padding:16px 14px 14px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>

<script>
(() => {
  const PRICE = 23999, PLANS = [3,4,6,9,12], DISC = {3:0,4:.02,6:.02,9:.02,12:.02};
  const SPEED = {3:{d:.26,lean:-12,s:1},4:{d:.34,lean:-8,s:.85},6:{d:.48,lean:-5,s:.55},9:{d:.7,lean:-2,s:.2},12:{d:1.05,lean:0,s:0}};
  const TODAY = new Date(2026,10,3);
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const R = '<svg class="riyal"><use href="#i-riyal"/></svg>';
  const fmt = v => v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
  const mon = d => d.toLocaleString('en-US',{month:'short'});
  const longDate = d => `${d.getDate()} ${mon(d)} ${d.getFullYear()}`;
  let n = 6, opened = false, paid = false;

  const calc = k => { const total = PRICE*(1-DISC[k]); return {monthly: Math.round(total/k*100)/100, save: Math.round(PRICE*DISC[k]*100)/100}; };
  const dates = k => Array.from({length:k}, (_,i) => new Date(2026,10+i,3));

  /* stage scaling */
  const wrap = $('pageWrap'), layer = $('pageLayer');
  function scaleStage(){
    if (matchMedia('(max-width:760px)').matches){ wrap.style.height=''; return; }
    const s = wrap.clientWidth/1903; layer.style.setProperty('--s', s); wrap.style.height = (910*s)+'px';
  }
  new ResizeObserver(scaleStage).observe(wrap); scaleStage();

  /* rolling digits */
  function odo(el, str){
    if (el.dataset.v && el.dataset.v.length === str.length){
      [...str].forEach((ch,i) => { if (/\d/.test(ch)) el.children[i].firstChild.style.transform = `translateY(${-ch}em)`; });
    } else {
      el.innerHTML = [...str].map(ch => /\d/.test(ch)
        ? `<span class="c" style="display:inline-block;height:1em;overflow:hidden"><span style="display:flex;flex-direction:column;transition:transform .8s var(--out);transform:translateY(${-ch}em)">${[...'0123456789'].map(d=>`<i style="font-style:normal;height:1em;line-height:1em">${d}</i>`).join('')}</span></span>`
        : `<span style="line-height:1em">${ch}</span>`).join('');
    }
    [...el.children].forEach((c,i,a) => { if (c.firstChild && c.firstChild.style) c.firstChild.style.transitionDelay = ((a.length-i)*30)+'ms'; });
    el.dataset.v = str;
  }

  /* payment pieces */
  const track = $('track');
  const pieces = Array.from({length:12}, (_,i) => {
    const p = document.createElement('div'); p.className = 'piece' + (i===0?' today':'');
    p.addEventListener('animationend', e => { if (e.animationName==='jolt') p.classList.remove('jolt'); });
    track.appendChild(p); return p;
  });
  function layout(gap = 5){
    const W = track.clientWidth, w = (W - (n-1)*gap)/n, ds = dates(n);
    track.classList.toggle('tight', w < 34);
    pieces.forEach((p,i) => {
      if (i < n){
        p.style.left = (i*(w+gap))+'px'; p.style.width = w+'px'; p.style.opacity = 1;
        if (!p.querySelector('.chk')) p.textContent = i===0 ? (w < 34 ? '' : 'Now') : (w < 26 ? mon(ds[i])[0] : mon(ds[i]));
      } else { p.style.left = W+'px'; p.style.width = '0px'; p.style.opacity = 0; }
    });
    $('lastPay').innerHTML = `Last payment <b>${longDate(ds[n-1])}</b>`;
  }
  new ResizeObserver(() => layout()).observe(track);

  /* plan picker */
  const chips = $('chips');
  const ind = document.createElement('span'); ind.className = 'ind'; ind.setAttribute('aria-hidden','true'); chips.appendChild(ind);
  const chipEls = () => chips.querySelectorAll('.chip');
  function moveInd(){ const b = chipEls()[PLANS.indexOf(n)]; if (!b) return; ind.style.width = b.offsetWidth+'px'; ind.style.transform = `translateX(${b.offsetLeft}px)`; }
  new ResizeObserver(moveInd).observe(chips);
  PLANS.forEach(k => {
    const b = document.createElement('button'); b.className='chip'; b.setAttribute('role','radio');
    b.innerHTML = `<span class="n">${k}<span style="font-weight:500;font-size:12px"> mo</span></span><span class="u">${fmt(calc(k).monthly)}</span>`;
    b.setAttribute('aria-label', `${k} payments of ${fmt(calc(k).monthly)} riyals${DISC[k]?', 2% off':''}`);
    b.onclick = () => setPlan(k);
    b.onkeydown = e => {
      const i = PLANS.indexOf(n);
      if (e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); setPlan(PLANS[Math.min(i+1,PLANS.length-1)], true); }
      if (e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); setPlan(PLANS[Math.max(i-1,0)], true); }
    };
    chips.appendChild(b);
  });

  function setPlan(k, focus){
    const had = DISC[n] > 0, prev = n; n = k;
    if (paid) resetPaid();
    const c = calc(k), [int, dec] = fmt(c.monthly).split('.');
    odo($('odoInt'), int); odo($('odoDec'), '.'+dec);
    $('then').innerHTML = `<b>${k} payments.</b> The first is today, the rest on the 3rd of each month.`;
    $('cta').innerHTML = `Pay ${R}<b>${fmt(c.monthly)}</b> today`;
    const save = $('save');
    save.className = 'save' + (c.save ? '' : ' off');
    const total = fmt(Math.round(c.monthly*k*100)/100);
    save.innerHTML = c.save ? `Total ${R}${total}. You save ${R}${fmt(c.save)} (2% off)` : `Total ${R}${total}. Choose 4 or more months to get 2% off`;
    if (c.save && !had && opened){ void save.offsetWidth; save.classList.add('pop'); }
    moveInd();
    [...chipEls()].forEach((b,i) => { const on = PLANS[i]===k; b.setAttribute('aria-checked', on); b.tabIndex = on?0:-1; if(on&&focus) b.focus(); });
    const sp = SPEED[k], r = $('runner');
    r.style.setProperty('--dur', sp.d+'s'); r.style.setProperty('--speed', sp.s);
    r.querySelector('.bob-wrap').style.rotate = sp.lean+'deg';
    if (prev !== k && opened){ r.classList.remove('hop'); void r.offsetWidth; r.classList.add('hop'); }
    layout();
    $('wInt').textContent = int; $('wDec').textContent = '.'+dec; $('wN').textContent = `${k} payments`;
    $('wDots').innerHTML = '<i></i>'.repeat(k);
  }

  /* number flight between widget and sheet */
  function flight(from, to, src, out){
    const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    if (reduce || !a.width || !b.width) return Promise.resolve();
    const f = src.cloneNode(true); f.removeAttribute('id'); f.querySelector('em')?.remove();
    f.classList.add('flyer'); f.style.fontSize = getComputedStyle(src).fontSize;
    f.style.left = a.left+'px'; f.style.top = a.top+'px';
    document.body.appendChild(f);
    const s0 = a.height / f.offsetHeight, s1 = b.height / f.offsetHeight;
    const anim = f.animate([
      {transform:`translate(0,0) scale(${s0})`},
      {transform:`translate(${(b.left-a.left)*.5}px,${(b.top-a.top)*.5 - 50}px) scale(${(s0+s1)/2}) rotate(${out?4:-4}deg)`, offset:.5},
      {transform:`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${s1})`}
    ], {duration: out ? 680 : 800, easing:'cubic-bezier(.3,.9,.3,1)', fill:'forwards'});
    return anim.finished.then(() => f.animate([{opacity:1},{opacity:0}],{duration:130,fill:'forwards'}).finished.then(()=>f.remove()));
  }
  async function flyIn(){
    const to = $('amount'); to.classList.add('hide');
    await flight($('wAmt'), to, $('wAmt'), false);
    to.classList.remove('hide');
  }
  function flyOut(){ $('amount').classList.add('hide'); flight($('amount'), $('wAmt'), $('wAmt'), true); }

  /* the price breaks into payments */
  async function crack(){
    track.classList.add('notrans'); layout(0);
    pieces.forEach((p,i) => { if (i<n) p.classList.add('hot'); });
    void track.offsetWidth;
    $('slab').classList.add('gone');
    await wait(80);
    track.classList.remove('notrans');
    pieces.forEach((p,i) => {
      if (i>=n) return;
      p.style.setProperty('--delay', (i*40)+'ms');
      p.classList.remove('jolt'); void p.offsetWidth; p.classList.add('jolt');
      setTimeout(() => p.classList.remove('hot'), reduce?0:240+i*60);
    });
    layout(5);
  }

  function resetPaid(){
    paid = false; $('cta').classList.remove('done');
    pieces[0].querySelector('.chk')?.remove();
    $('lbl').textContent = 'Monthly payment'; $('runner').classList.remove('exit');
  }
  $('cta').onclick = () => {
    if (paid) return; paid = true;
    const c = document.createElement('span'); c.className='chk'; pieces[0].textContent=''; pieces[0].appendChild(c);
    $('lbl').textContent = 'First payment done';
    const r = $('runner'); r.classList.remove('in'); r.classList.add('exit');
    const nx = dates(n)[1], cta = $('cta'); cta.classList.add('done');
    cta.innerHTML = `Done. Next payment <b>${nx.getDate()} ${mon(nx)}</b>`;
  };

  async function open(){
    if (opened) return; opened = true;
    $('slab').classList.remove('gone'); $('amount').classList.remove('hide');
    pieces.forEach(p => p.classList.remove('jolt','hot'));
    resetPaid(); setPlan(n);
    document.body.classList.add('sheet-open');
    const r = $('runner'); r.classList.remove('in'); void r.offsetWidth;
    await wait(620);
    flyIn();
    await wait(560);
    crack(); r.classList.add('in');
    $('close').focus({preventScroll:true, focusVisible:false});
  }
  function close(){
    if (!opened) return; opened = false; flyOut();
    document.body.classList.remove('sheet-open'); $('widget').focus({preventScroll:true, focusVisible:false});
  }

  $('widget').onclick = open;
  $('close').onclick = close; $('scrim').onclick = close;
  document.addEventListener('keydown', e => { if (e.key==='Escape' && opened) close(); });
  $('replay').onclick = async () => { if (opened){ close(); await wait(900); } open(); };

  setPlan(6);
  setTimeout(open, reduce ? 0 : 1100);
})();
</script>
